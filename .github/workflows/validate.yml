name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: description issues topics

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests (HA ${{ matrix.homeassistant }})
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.0", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install test dependencies and Home Assistant
        run: |
          if [ "${{ matrix.homeassistant }}" = "stable" ]; then
            python -m pip install -r requirements-test-common.txt homeassistant
          else
            python -m pip install -r requirements-test-common.txt "homeassistant==${{ matrix.homeassistant }}"
          fi
          python -m pip check
      - run: python tools/run_tests.py
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.homeassistant }}
          path: coverage-report/
          if-no-files-found: warn

  typing:
    name: Strict typing (HA stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test-common.txt homeassistant mypy==2.4.0
      - run: python -m mypy

  preview:
    name: Tests (HA preview, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements-test-common.txt
      - run: python -m pip install --upgrade --pre homeassistant
      - run: python -m pip check
      - run: python tools/run_tests.py
      - name: Upload preview coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-preview
          path: coverage-report/
          if-no-files-found: warn
